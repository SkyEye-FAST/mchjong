plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = "mchjong-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
tasks.named('compileJava', JavaCompile) { options.release = minecraft_java_version.toInteger() }

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BMCLAPIForge'
                url = 'https://bmclapi2.bangbang93.com/maven/'
            }
        }
        filter { includeModule 'net.minecraftforge', 'forge' }
    }
}

sourceSets {
    ponderData {
        java.srcDir '../common/src/ponderData/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
    smoke {
        java.srcDir '../common/src/smoke/java'
        resources.srcDir '../common/src/smoke/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def ponderSmoke = providers.gradleProperty('withPonder').getOrElse('false').toBoolean()
def bootstrapSmoke = providers.gradleProperty('smokeBootstrap').getOrElse('false').toBoolean()
def browserSmoke = providers.gradleProperty('smokeBrowser').getOrElse('false').toBoolean()
def recipeBrowser = providers.gradleProperty('recipeBrowser').getOrElse('none')
if (browserSmoke && recipeBrowser == 'none') throw new GradleException('smokeBrowser requires a recipeBrowser profile')
def smokeProfile = bootstrapSmoke ? 'bootstrap-' : browserSmoke ? 'browser-' + recipeBrowser + '-' : recipeBrowser != 'none' ? recipeBrowser + '-' : ponderSmoke ? 'ponder-' : ''
def smokeEvidence = layout.buildDirectory.dir("smoke/${smokeProfile}evidence")
def smokeRun = layout.buildDirectory.dir("smoke/${smokeProfile}run")

legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        disableRecompilation = false
    }
    mods {
        mchjong { sourceSet sourceSets.main }
        mchjong_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        client { client() }
        server { server(); programArguments.add('--nogui') }
        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            gameDirectory = smokeRun.get().asFile
            systemProperty 'mchjong.smoke.bootstrap', bootstrapSmoke.toString()
            systemProperty 'mchjong.smoke', (!bootstrapSmoke).toString()
            systemProperty 'mchjong.smoke.ponder', ponderSmoke.toString()
            systemProperty 'mchjong.smoke.browser', recipeBrowser
            systemProperty 'mchjong.smoke.browserOnly', browserSmoke.toString()
            systemProperty 'mchjong.smoke.output', smokeEvidence.get().asFile.absolutePath
            programArguments.addAll('--mixin', 'mchjong.smoke.mixins.json')
            programArguments.addAll('--width', '1280', '--height', '800')
        }
        smokeServer {
            server()
            programArguments.addAll('--nogui', '--initSettings')
            gameDirectory = layout.buildDirectory.dir('smoke/server').get().asFile
        }
    }
}

tasks.named('runSmokeClient') {
    doFirst { delete smokeEvidence.get().file('PASS.txt'), smokeEvidence.get().file('FAIL.txt') }
    doLast {
        if (!smokeEvidence.get().file('PASS.txt').asFile.isFile() || smokeEvidence.get().file('FAIL.txt').asFile.exists())
            throw new GradleException("Forge client smoke failed; inspect ${smokeRun.get().asFile}/logs/latest.log")
    }
}

configurations { embeddedEngine }
dependencies {
    modCompileOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    if (providers.gradleProperty('withPonder').getOrElse('false').toBoolean()) {
        modRuntimeOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
        modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    modCompileOnly "dev.architectury:architectury-forge:${architectury_version}"
    def browser = providers.gradleProperty('recipeBrowser').getOrElse('none')
    if (!(browser in ['none', 'jei', 'emi', 'rei'])) throw new GradleException('recipeBrowser must be none, jei, emi or rei')
    if (browser == 'jei') modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    if (browser == 'emi') modRuntimeOnly "dev.emi:emi-forge:${emi_version}"
    if (browser == 'rei') {
        modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version}"
        modRuntimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
        modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"
    }
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    embeddedEngine project(path: ':engine', configuration: 'embeddedEngine')
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
    resources.srcDir layout.buildDirectory.dir('generated/ponder')
}

sourceSets.ponderData.runtimeClasspath += sourceSets.ponderData.compileClasspath
tasks.register('generatePonder', JavaExec) {
    dependsOn tasks.named('ponderDataClasses')
    classpath = sourceSets.ponderData.runtimeClasspath
    mainClass = 'top.skyeyefast.mchjong.data.GeneratePonderStructure'
    def output = layout.buildDirectory.dir('generated/ponder')
    args output.get().asFile.absolutePath
    inputs.files sourceSets.ponderData.allSource
    outputs.dir output
    doFirst { delete output }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version.toInteger()) }
}

mixin {
    add sourceSets.main, 'mchjong.refmap.json'
    config 'mchjong.client.mixins.json'
    config 'mchjong.data.mixins.json'
    config 'mchjong.forge.mixins.json'
}

processResources {
    dependsOn ':art:generateAssets', ':art:generateData', 'generatePonder'
    def properties = [version: project.version, minecraft_version: minecraft_version, forge_loader_min_version: forge_loader_min_version,
        jei_version: jei_version, emi_version: emi_version, rei_version: rei_version, ponder_version: ponder_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
    filesMatching(['mchjong.client.mixins.json', 'mchjong.data.mixins.json']) {
        filter { line -> line.replace('"required": true,', '"required": true, "refmap": "mchjong.refmap.json",') }
    }
}

def embeddedEngine = configurations.embeddedEngine
def engineContents = providers.provider { embeddedEngine.collect { zipTree(it) } }
jar {
    dependsOn embeddedEngine
    from engineContents
    from(rootProject.file('LICENSE'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes 'MixinConfigs': 'mchjong.client.mixins.json,mchjong.data.mixins.json,mchjong.forge.mixins.json'
}
