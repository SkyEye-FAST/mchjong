plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = "mchjong-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            args '--mixin.config=mchjong.client.mixins.json', '--mixin.config=mchjong.forge.mixins.json'
        }
        register('client') {
            with(sourceSets.test) {
                workingDir = layout.buildDirectory.dir('smoke/client')
                systemProperty 'mchjong.smoke.bootstrap', 'true'
                systemProperty 'mchjong.smoke.output', layout.buildDirectory.dir('smoke/bootstrap-evidence').get().asFile.absolutePath
                args '--width', '1280', '--height', '800'
            }
        }
        register('server') {
            args '--nogui'
            with(sourceSets.test) {
                args '--initSettings'
                workingDir = layout.buildDirectory.dir('smoke/server')
            }
        }
    }
}

tasks.register('runSmokeServer') {
    group = 'verification'
    description = 'Load Forge and initialize dedicated-server settings in an isolated directory.'
    dependsOn 'runTestServer'
}

tasks.register('runSmokeClient') {
    group = 'verification'
    description = 'Check Forge client registration, shared renderers and model loading.'
    dependsOn 'runTestClient'
    doLast {
        if (!layout.buildDirectory.file('smoke/bootstrap-evidence/PASS.txt').get().asFile.isFile())
            throw new GradleException('Forge client bootstrap did not finish; inspect smoke/client/logs/latest.log')
    }
}
tasks.matching { it.name == 'runTestClient' }.configureEach {
    doFirst { delete layout.buildDirectory.file('smoke/bootstrap-evidence/PASS.txt') }
}

configurations { embeddedEngine }
sourceSets.test.output.resourcesDir = layout.buildDirectory.dir('classes/java/test').get().asFile
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    embeddedEngine project(path: ':engine', configuration: 'embeddedEngine')
}

sourceSets.main {
    // Forge scans the directory containing mods.toml for annotated entry points.
    output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
    java.srcDir '../common/src/main/java'
    java.exclude 'top/skyeyefast/mchjong/compat/ponder/**'
    java.exclude 'top/skyeyefast/mchjong/compat/jei/**'
    java.exclude 'top/skyeyefast/mchjong/compat/emi/**'
    java.exclude 'top/skyeyefast/mchjong/compat/rei/**'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
}

processResources {
    dependsOn ':art:generateAssets', ':art:generateData'
    def properties = [version: project.version, minecraft_version: minecraft_version, forge_loader_min_version: forge_loader_min_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

def embeddedEngine = configurations.embeddedEngine
def engineContents = providers.provider { embeddedEngine.collect { zipTree(it) } }
jar {
    dependsOn embeddedEngine
    from engineContents
    from(rootProject.file('LICENSE'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes 'MixinConfigs': 'mchjong.client.mixins.json,mchjong.forge.mixins.json'
}
