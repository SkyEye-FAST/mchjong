plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = "mchjong-forge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

// Configuring this subproject must not reject an EMI runtime requested for Fabric or NeoForge.
def recipeBrowser = providers.gradleProperty('forgeRecipeBrowser').getOrElse(
    providers.gradleProperty('recipeBrowser').getOrElse('none') == 'jei' ? 'jei' : 'none')
if (!(recipeBrowser in ['none', 'jei'])) throw new GradleException('Forge recipeBrowser must be none or jei')
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            args '--mixin.config=mchjong.client.mixins.json', '--mixin.config=mchjong.forge.mixins.json'
        }
        register('client') {}
        register('server') {
            args '--nogui'
        }
    }
}

configurations { embeddedEngine }
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    embeddedEngine project(path: ':engine', configuration: 'embeddedEngine')
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    if (recipeBrowser == 'jei') {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
        runtimeOnly "net.mezzdev.config:mezz_config-${minecraft_version}-forge:${mezz_config_version}"
    }
}

sourceSets.main {
    // Forge scans the directory containing mods.toml for annotated entry points.
    output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
    java.srcDir '../common/src/main/java'
    java.exclude 'top/skyeyefast/mchjong/compat/ponder/**'
    java.exclude 'top/skyeyefast/mchjong/compat/emi/**'
    java.exclude 'top/skyeyefast/mchjong/compat/rei/**'
    java.exclude 'top/skyeyefast/mchjong/compat/maid/**'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.file('art/generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
}

processResources {
    with rootProject.tileFaceResources
    dependsOn ':art:generateData'
    mustRunAfter ':art:generateAssets'
    def properties = [version: project.version, minecraft_version: minecraft_version, forge_loader_min_version: forge_loader_min_version, jei_version: jei_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

def embeddedEngine = configurations.embeddedEngine
def engineContents = providers.provider { embeddedEngine.collect { zipTree(it) } }
jar {
    dependsOn embeddedEngine
    from engineContents
    from(rootProject.file('LICENSE'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes 'MixinConfigs': 'mchjong.client.mixins.json,mchjong.forge.mixins.json'
}
