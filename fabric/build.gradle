import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.mod_version
group = rootProject.maven_group
base.archivesName = "mchjong-fabric-${minecraft_version}"

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'OrihimeSnapshots'
                url = 'https://github.com/Sh1roCu/TouhouLittleMaid-Orihime/releases/download'
                patternLayout { artifact '[revision]/touhoulittlemaid-fabric-[artifact].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'cn.sh1rocu.snapshot' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
        filter { includeGroup 'fuzs.forgeconfigapiport' }
    }
}

def maidDependency = "cn.sh1rocu.snapshot:${orihime_version}:${orihime_snapshot}@jar"
configurations { maidSnapshot }

dependencies {
    compileOnly "vazkii.patchouli:patchouli-fabric:${patchouli_version}"
    if (providers.gradleProperty('withPatchouli').getOrElse('false').toBoolean()) {
        localRuntime "vazkii.patchouli:patchouli-fabric:${patchouli_version}"
    }
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    if (providers.gradleProperty('withModMenu').getOrElse('false').toBoolean()) {
        localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    }
    implementation "com.electronwill.night-config:toml:${night_config_version}"
    include "com.electronwill.night-config:core:${night_config_version}"
    include "com.electronwill.night-config:toml:${night_config_version}"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${rei_architectury_version}"
    compileOnly "me.shedaniel.cloth:basic-math:${rei_basic_math_version}"
    compileOnly maidDependency
    maidSnapshot maidDependency
    if (providers.gradleProperty('withMaid').getOrElse('false').toBoolean()) {
        runtimeOnly maidDependency
        runtimeOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    }
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'jei') {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
        runtimeOnly "net.mezzdev.config:mezz_config-${minecraft_version}-fabric:${mezz_config_version}"
    }
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'rei') {
        runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    include project(path: ':engine', configuration: 'embeddedEngine')
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def testTemp = layout.buildDirectory.dir('tmp/test')
test {
    useJUnitPlatform()
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
}

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.file('art/generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
}

// Native Minecraft NBT APIs, isolated from the mod's main compilation and packaging.
sourceSets {
    ponderData {
        java.srcDir '../common/src/ponderData/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
}
sourceSets.ponderData.runtimeClasspath += sourceSets.ponderData.compileClasspath
tasks.register('generatePonder', JavaExec) {
    dependsOn tasks.named('ponderDataClasses')
    classpath = sourceSets.ponderData.runtimeClasspath
    mainClass = 'top.skyeyefast.mchjong.data.GeneratePonderStructure'
    def output = layout.buildDirectory.dir('generated/ponder')
    args output.get().asFile.absolutePath
    inputs.files sourceSets.ponderData.allSource
    outputs.dir output
    doFirst { delete output }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version.toInteger()) }
}

processResources {
    with rootProject.tileFaceResources
    from tasks.named('generatePonder')
    dependsOn ':art:generateData', 'generatePonder'
    mustRunAfter ':art:generateAssets'
    def properties = [
        version: project.version,
        minecraft_version: minecraft_version,
        java_version: java_version,
        fabric_loader_min_version: fabric_loader_min_version,
        jei_version: jei_version,
        rei_version: rei_version,
        orihime_version: orihime_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

tasks.named('sourcesJar') {
    with rootProject.tileFaceResources
    dependsOn ':art:generateData'
    mustRunAfter ':art:generateAssets'
    from tasks.named('generatePonder')
}
jar { from(rootProject.file('LICENSE')) }

// Native inventory checks need a real player and world, not a screenshot harness.
sourceSets {
    smoke {
        java.srcDir '../common/src/smoke/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def recipeBrowser = providers.gradleProperty('recipeBrowser').getOrElse('none')
if (!(recipeBrowser in ['none', 'jei', 'rei'])) throw new GradleException('recipeBrowser must be none, jei or rei')
def patchouliSmoke = providers.gradleProperty('smokePatchouli').getOrElse('false').toBoolean()
def patchouliInstalled = providers.gradleProperty('withPatchouli').getOrElse('false').toBoolean()
def smokeProfile = patchouliSmoke ? (patchouliInstalled ? 'patchouli-installed-' : 'patchouli-absent-') : ''
def smokeEvidence = layout.buildDirectory.dir("smoke/${smokeProfile}evidence")
def smokeRun = layout.buildDirectory.dir("smoke/${smokeProfile}run")
loom {
    mods {
        mchjong { sourceSet sourceSets.main }
        mchjong_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        smokeClient {
            client()
            source sourceSets.smoke
            runDir smokeRun.get().asFile.absolutePath
            programArgs '--width', '1280', '--height', '800'
            property 'mchjong.smoke', 'true'
            property 'mchjong.smoke.patchouliOnly', patchouliSmoke.toString()
            property 'mchjong.smoke.patchouli', patchouliInstalled.toString()
            property 'mchjong.smoke.screenshots', providers.gradleProperty('smokeScreenshots').getOrElse('')
            property 'mchjong.smoke.output', smokeEvidence.get().asFile.absolutePath
            property 'java.io.tmpdir', smokeRun.get().asFile.absolutePath
        }
    }
}

tasks.named('runSmokeClient') {
    doFirst { delete smokeEvidence }
    doLast {
        def evidence = smokeEvidence.get().asFile
        if (!new File(evidence, 'PASS.txt').isFile() || new File(evidence, 'FAIL.txt').exists()) {
            throw new GradleException("Client smoke failed; see ${evidence} and ${smokeRun.get().asFile}/logs/latest.log")
        }
    }
}

tasks.register('verifyMaidSnapshot') {
    inputs.files configurations.maidSnapshot
    inputs.property 'sha256', orihime_sha256
    doLast {
        def digest = MessageDigest.getInstance('SHA-256').digest(configurations.maidSnapshot.singleFile.bytes)
        if (digest.encodeHex().toString() != orihime_sha256)
            throw new GradleException('The pinned Orihime snapshot checksum does not match')
    }
}
tasks.named('compileJava') { dependsOn 'verifyMaidSnapshot' }

apply from: rootProject.file('gradle/quilt-smoke.gradle')
