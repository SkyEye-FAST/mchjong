name: Snapshot CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Development mod_version must be a semantic version ending in -SNAPSHOT, got: ${version:-<missing>}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build snapshot artifacts
        run: bash gradlew clean buildAll --no-daemon

      - name: Verify snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          test -f "build/libs/mchjong-fabric-${version}.jar"
          test -f "neoforge/build/libs/mchjong-neoforge-${version}.jar"

      - name: Upload Fabric snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-fabric-${{ steps.version.outputs.version }}
          path: build/libs/mchjong-fabric-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload NeoForge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-neoforge-${{ steps.version.outputs.version }}
          path: neoforge/build/libs/mchjong-neoforge-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
