name: Snapshot CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Development mod_version must be a semantic version ending in -SNAPSHOT, got: ${version:-<missing>}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mchjong-snapshot"
          bash gradlew clean buildAll --no-daemon --warning-mode fail --max-workers=2 2>&1 | tee "${RUNNER_TEMP}/mchjong-snapshot/build.log"

      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diagnostics-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/problems/**
            ${{ runner.temp }}/mchjong-snapshot/**
          if-no-files-found: warn

      - name: Verify snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          minecraft="${{ steps.version.outputs.minecraft }}"
          for loader in fabric forge neoforge; do
            test -f "${loader}/build/libs/mchjong-${loader}-${minecraft}-${version}.jar"
          done

      - name: Upload 1.21.1 Fabric snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-fabric-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: fabric/build/libs/mchjong-fabric-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload 1.21.1 NeoForge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: neoforge/build/libs/mchjong-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload 1.21.1 Forge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-forge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: forge/build/libs/mchjong-forge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
