name: Snapshot CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build snapshot
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.project.neoForge.neoFormRuntime.launcherManifestUrl=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Development mod_version must be a semantic version ending in -SNAPSHOT, got: ${version:-<missing>}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "${GITHUB_OUTPUT}"
          compat_ref="$(tr -d '\r\n' < .github/compat-1.20.1-ref)"
          [[ "${compat_ref}" =~ ^[0-9a-f]{40}$ ]]
          echo "compat_ref=${compat_ref}" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build snapshot artifacts
        run: bash gradlew clean buildAll --no-daemon

      - name: Checkout reviewed Minecraft 1.20.1 port
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.compat_ref }}
          path: compat-1.20.1

      - name: Build Minecraft 1.20.1 snapshot artifacts
        working-directory: compat-1.20.1
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: bash gradlew buildAll --no-daemon -Pmod_version="${MOD_VERSION}"

      - name: Verify snapshot artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          minecraft="${{ steps.version.outputs.minecraft }}"
          for loader in fabric forge neoforge; do
            test -f "${loader}/build/libs/mchjong-${loader}-${minecraft}-${version}.jar"
          done
          for loader in fabric forge; do
            test -f "compat-1.20.1/${loader}/build/libs/mchjong-${loader}-1.20.1-${version}.jar"
          done

      - name: Upload Fabric snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-fabric-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: fabric/build/libs/mchjong-fabric-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload NeoForge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: neoforge/build/libs/mchjong-neoforge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload Forge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-forge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}
          path: forge/build/libs/mchjong-forge-${{ steps.version.outputs.minecraft }}-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload Minecraft 1.20.1 Fabric snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-fabric-1.20.1-${{ steps.version.outputs.version }}
          path: compat-1.20.1/fabric/build/libs/mchjong-fabric-1.20.1-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload Minecraft 1.20.1 Forge snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mchjong-forge-1.20.1-${{ steps.version.outputs.version }}
          path: compat-1.20.1/forge/build/libs/mchjong-forge-1.20.1-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
