name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.project.neoForge.neoFormRuntime.launcherManifestUrl=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          snapshot_version="$(sed -n 's/^mod_version=//p' gradle.properties)"

          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version such as 0.1.0, got: ${tag}" >&2
            exit 1
          fi

          if [[ ! "${snapshot_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Development mod_version must end in -SNAPSHOT, got: ${snapshot_version:-<missing>}" >&2
            exit 1
          fi

          version="${snapshot_version%-SNAPSHOT}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Release tag ${tag} does not match snapshot target ${snapshot_version}" >&2
            exit 1
          fi

          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "${GITHUB_OUTPUT}"
          compat_1201_ref="$(tr -d '\r\n' < .github/compat-1.20.1-ref)"
          compat_2612_ref="$(tr -d '\r\n' < .github/compat-26.1.2-ref)"
          [[ "${compat_1201_ref}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${compat_2612_ref}" =~ ^[0-9a-f]{40}$ ]]
          echo "compat_1201_ref=${compat_1201_ref}" >> "${GITHUB_OUTPUT}"
          echo "compat_2612_ref=${compat_2612_ref}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; section = 1; next }
            section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            section { print }
            END { if (!found) exit 42 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no release notes for ${version}" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release artifacts
        run: bash gradlew clean buildAll --no-daemon -Pmod_version="${GITHUB_REF_NAME}"

      - name: Checkout reviewed Minecraft 1.20.1 port
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.compat_1201_ref }}
          path: compat-1.20.1

      - name: Build Minecraft 1.20.1 release artifacts
        working-directory: compat-1.20.1
        run: bash gradlew buildAll --no-daemon -Pmod_version="${GITHUB_REF_NAME}"

      - name: Checkout reviewed Minecraft 26.1.2 port
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.compat_2612_ref }}
          path: compat-26.1.2

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build Minecraft 26.1.2 release artifacts
        working-directory: compat-26.1.2
        env:
          ORG_GRADLE_PROJECT_neo_maven_url: https://maven.neoforged.net/releases
          ORG_GRADLE_PROJECT_loom_resources_base: https://resources.download.minecraft.net/
          ORG_GRADLE_PROJECT_loom_version_manifests: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
        run: bash gradlew buildAll --no-daemon -Pmod_version="${GITHUB_REF_NAME}"

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          minecraft="${{ steps.version.outputs.minecraft }}"
          for loader in fabric forge neoforge; do
            test -f "${loader}/build/libs/mchjong-${loader}-${minecraft}-${version}.jar"
          done
          for loader in fabric forge; do
            test -f "compat-1.20.1/${loader}/build/libs/mchjong-${loader}-1.20.1-${version}.jar"
          done
          for loader in fabric neoforge; do
            test -f "compat-26.1.2/${loader}/build/libs/mchjong-${loader}-26.1.2-${version}.jar"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          gh release create "${GITHUB_REF_NAME}" \
            "fabric/build/libs/mchjong-fabric-${{ steps.version.outputs.minecraft }}-${version}.jar#${{ steps.version.outputs.minecraft }} Fabric / Quilt" \
            "forge/build/libs/mchjong-forge-${{ steps.version.outputs.minecraft }}-${version}.jar#${{ steps.version.outputs.minecraft }} Forge" \
            "neoforge/build/libs/mchjong-neoforge-${{ steps.version.outputs.minecraft }}-${version}.jar#${{ steps.version.outputs.minecraft }} NeoForge" \
            "compat-1.20.1/fabric/build/libs/mchjong-fabric-1.20.1-${version}.jar#1.20.1 Fabric / Quilt" \
            "compat-1.20.1/forge/build/libs/mchjong-forge-1.20.1-${version}.jar#1.20.1 Forge" \
            "compat-26.1.2/fabric/build/libs/mchjong-fabric-26.1.2-${version}.jar#26.1.2 Fabric" \
            "compat-26.1.2/neoforge/build/libs/mchjong-neoforge-26.1.2-${version}.jar#26.1.2 NeoForge" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "mchjong ${GITHUB_REF_NAME}"
