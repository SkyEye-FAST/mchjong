plugins { id 'java' }

// Source artwork is a pinned, checksummed build dependency, not a game dependency.
configurations {
    tileArtwork { canBeConsumed = false; transitive = false }
}
repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'RiichiTileArtwork'
                url = 'https://codeload.github.com/FluffyStuff/riichi-mahjong-tiles'
                patternLayout { artifact 'zip/[revision]' }
                metadataSources { artifact() }
            }
        }
        filter { includeModule 'artwork', 'riichi-mahjong-tiles' }
    }
}
dependencies {
    tileArtwork 'artwork:riichi-mahjong-tiles:26e127ba2117f45cdce5ea0225748cc0cfad3169@zip'
    implementation "com.github.weisj:jsvg:${jsvg_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation project(':engine')
}
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

def renderedAssets = layout.buildDirectory.dir('renderedAssets')
def testTemp = layout.buildDirectory.dir('tmp/test')
tasks.register('renderAssets', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.skyeyefast.mchjong.art.GenerateAssets'
    doFirst {
        def outputDir = renderedAssets.get().asFile
        if (outputDir.exists() && !outputDir.deleteDir()) {
            throw new GradleException("Could not clean ${outputDir}")
        }
        args renderedAssets.get().asFile.absolutePath, configurations.tileArtwork.singleFile.absolutePath
    }
    outputs.dir renderedAssets
    inputs.files sourceSets.main.allSource
    inputs.files configurations.tileArtwork
    systemProperty 'java.awt.headless', 'true'
}

// Sync removes retired resources instead of leaving stale atlas cells in the jars.
tasks.register('generateAssets', Sync) {
    dependsOn 'renderAssets'
    from renderedAssets
    into rootProject.layout.buildDirectory.dir('generated/assets')
}

test {
    useJUnitPlatform()
    dependsOn generateAssets
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
    systemProperty 'mchjong.resources', rootProject.layout.buildDirectory.dir('generated/assets').get().asFile.absolutePath
    systemProperty 'mchjong.languages', rootProject.file('common/src/main/resources/assets/mchjong/lang').absolutePath
    systemProperty 'mchjong.sourceRoot', rootProject.projectDir.absolutePath
    ['common/src/main', 'engine/src/main', 'src/main', 'neoforge/src/main'].each { source ->
        inputs.files rootProject.fileTree(source) { include '**/*.java', '**/*.kt' }
    }
    inputs.dir rootProject.file('common/src/main/resources/assets/mchjong/lang')
    inputs.file rootProject.file('common/src/main/resources/assets/mchjong/sounds.json')
    inputs.dir rootProject.layout.buildDirectory.dir('generated/assets')
    inputs.files configurations.tileArtwork
    doFirst { systemProperty 'mchjong.artwork', configurations.tileArtwork.singleFile.absolutePath }
    systemProperty 'java.awt.headless', 'true'
}
