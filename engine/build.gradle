plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'com.gradleup.shadow' version "${shadow_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = 'mchjong-engine'
repositories { mavenCentral() }

dependencies {
    implementation platform("org.jetbrains.kotlinx:kotlinx-serialization-bom:${kotlinx_serialization_version}")
    implementation "io.github.ssttkkl:mahjong-utils-jvm:${mahjong_utils_version}"
    implementation "top.skyeyefast:mcr-mahjong:${mcr_mahjong_version}"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm'
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "com.google.code.gson:gson:${gson_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
kotlin.jvmToolchain(java_version.toInteger())
// One engine artifact runs on both Minecraft 1.20.1 (Java 17) and 1.21.1 (Java 21).
tasks.named('compileJava', JavaCompile) { options.release = 17 }
tasks.named('compileKotlin') { compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
test { useJUnitPlatform(); maxHeapSize = '1G' }

shadowJar {
    addMultiReleaseAttribute = false
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier = ''
    relocate 'mahjongutils', 'top.skyeyefast.mchjong.internal.mahjongutils'
    relocate 'top.skyeyefast.mcr', 'top.skyeyefast.mchjong.internal.mcr'
    relocate 'kotlin', 'top.skyeyefast.mchjong.internal.kotlin'
    relocate 'kotlinx', 'top.skyeyefast.mchjong.internal.kotlinx'
    relocate 'com.google.gson', 'top.skyeyefast.mchjong.internal.gson'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    exclude 'org/jetbrains/annotations/**', 'org/intellij/lang/annotations/**'
    mergeServiceFiles()
    manifest.attributes 'Automatic-Module-Name': 'top.skyeyefast.mchjong.engine', 'FMLModType': 'LIBRARY'
}
jar { archiveClassifier = 'unshaded' }

// Loader distributions embed one self-contained artifact. Its private runtime
// is already inside the Shadow archive and has no external dependency graph.
configurations {
    embeddedEngine {
        canBeConsumed = true
        canBeResolved = false
        outgoing.artifact(tasks.named('shadowJar'))
    }
}
