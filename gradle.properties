# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft/Fabric build profile
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
java_version=25
loader_version=0.19.5
fabric_loader_min_version=0.19.5
loom_version=1.18.1

# Fabric Loom download mirrors; see docs/BUILD_MIRRORS.md.
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
loom_fabric_repository=https://maven.fabricmc.net/

# NeoForm Runtime metadata mirror. Client assets use NFRT_ASSET_REPOSITORY.
neoForge.neoFormRuntime.launcherManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
neo_maven_url=https://bmclapi2.bangbang93.com/maven/

