plugins {
    id 'base'
    id 'com.diffplug.spotless' version "${spotless_version}"
}

allprojects {
    repositories {
        exclusiveContent {
            forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
        exclusiveContent {
            forRepository { maven { name = 'JEI'; url = 'https://maven.blamejared.com/' } }
            filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
        }
        exclusiveContent {
            forRepository { maven { name = 'EMI'; url = 'https://repo.sleeping.town/' } }
            filter { includeGroup 'dev.emi' }
        }
        exclusiveContent {
            forRepository { maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' } }
            filter {
                includeGroup 'me.shedaniel'
                includeGroup 'me.shedaniel.cloth'
                includeGroup 'dev.architectury'
            }
        }
        exclusiveContent {
            forRepository { maven { name = 'Create'; url = 'https://maven.createmod.net' } }
            filter {
                includeGroup 'net.createmod.ponder'
                includeGroup 'dev.engine-room.flywheel'
                includeModule 'com.simibubi.create', 'create-1.20.1'
            }
        }
        exclusiveContent {
            forRepository { maven { name = 'CreateFabric'; url = 'https://mvn.devos.one/snapshots/' } }
            filter {
                includeModule 'com.simibubi.create', 'create-fabric'
                includeGroup 'com.tterrag.registrate_fabric'
                includeGroup 'io.github.tropheusj'
            }
        }
        exclusiveContent {
            forRepository { maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/mirror/' } }
            filter { includeGroup 'com.tterrag.registrate' }
        }
        exclusiveContent {
            forRepository { maven { name = 'PortingLib'; url = 'https://mvn.devos.one/releases/' } }
            filter { includeGroup 'io.github.fabricators_of_create.Porting-Lib' }
        }
        exclusiveContent {
            forRepository { maven { name = 'ReachEntityAttributes'; url = 'https://maven.jamieswhiteshirt.com/libs-release/' } }
            filter { includeGroup 'com.jamieswhiteshirt' }
        }
        exclusiveContent {
            forRepository { maven { name = 'ForgeConfigAPIPort'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
            filter { includeGroup 'fuzs.forgeconfigapiport' }
        }
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public/'
            content { excludeGroupByRegex 'net\\.(fabricmc|minecraftforge|neoforged)(\\..*)?' }
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
    }
}

spotless {
    java {
        target 'common/src/**/*.java', 'fabric/src/**/*.java', 'forge/src/**/*.java', 'art/src/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
    kotlin {
        target 'engine/src/**/*.kt'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
    format 'json', {
        target 'common/src/main/resources/**/*.json'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(2)
    }
    format 'misc', {
        target '*.gradle', 'gradle/*.gradle', 'fabric/*.gradle', 'forge/*.gradle', 'engine/*.gradle', 'art/*.gradle', '*.md', 'docs/*.md', '.gitignore', '.editorconfig'
        targetExclude 'release-notes.md'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Test the shared engine and build all loader artifacts for the selected Minecraft profile.'
    dependsOn ':fabric:build', ':forge:build', ':engine:check', ':art:check', 'spotlessCheck'
}
