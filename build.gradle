plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = mod_version
group = maven_group
base.archivesName = 'mchjong-fabric'

allprojects {
    repositories {
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            name = 'BMCLAPI'
            url = 'https://bmclapi2.bangbang93.com/maven/'
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    ['fabric-item-group-api-v1', 'fabric-networking-api-v1', 'fabric-rendering-v1',
     'fabric-resource-loader-v0', 'fabric-lifecycle-events-v1', 'fabric-registry-sync-v0',
     'fabric-transitive-access-wideners-v1'].each { module ->
        modImplementation fabricApi.module(module, fabric_version)
    }
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    include project(path: ':engine', configuration: 'embeddedEngine')
}

sourceSets.main {
    java.srcDir 'common/src/main/java'
    resources.srcDir 'common/src/main/resources'
    resources.srcDir layout.buildDirectory.dir('generated/assets')
}

processResources {
    dependsOn ':art:generateAssets'
    def properties = [
        version: project.version,
        minecraft_version: minecraft_version,
        java_version: java_version,
        fabric_loader_min_version: fabric_loader_min_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

tasks.named('sourcesJar') { dependsOn ':art:generateAssets' }
jar { from('LICENSE'); from('NOTICE') }

tasks.register('buildAll') {
    group = 'build'
    description = 'Test the shared engine and build both loader artifacts for the selected Minecraft profile.'
    dependsOn 'build', ':engine:check', ':neoforge:build', ':art:check'
}

// This mod is loaded only by the visual smoke run, never packaged for players.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def smokeEvidence = layout.buildDirectory.dir('smoke/evidence')
loom {
    mods {
        mchjong { sourceSet sourceSets.main }
        mchjong_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        smokeClient {
            client()
            source sourceSets.smoke
            runDir 'build/smoke/run'
            programArgs '--width', '1280', '--height', '800'
            property 'mchjong.smoke', 'true'
            property 'mchjong.smoke.output', smokeEvidence.get().asFile.absolutePath
            property 'java.io.tmpdir', layout.buildDirectory.dir('smoke/run').get().asFile.absolutePath
        }
    }
}

tasks.named('runSmokeClient') {
    doLast {
        def evidence = smokeEvidence.get().asFile
        if (!new File(evidence, 'PASS.txt').isFile() || new File(evidence, 'FAIL.txt').exists()) {
            throw new GradleException('Client smoke failed; see build/smoke/evidence and build/smoke/run/logs/latest.log')
        }
    }
}
