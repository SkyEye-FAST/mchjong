plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = "mchjong-neoforge-${minecraft_version}"
repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'TouhouLittleMaidSnapshots'
                url = 'https://github.com/TouhouLittleMaid/TouhouLittleMaid-26.1/releases/download'
                patternLayout { artifact '[revision]/touhoulittlemaid-[artifact]-snapshot.[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'touhoulittlemaid.snapshot' }
    }
    exclusiveContent {
        forRepository { maven { name = 'NeoForgeMain'; url = rootProject.neo_maven_url } }
        filter { includeModule 'net.neoforged', 'neoforge' }
    }
    exclusiveContent {
        forRepository { maven { name = 'NeoForgedReleases'; url = 'https://maven.neoforged.net/releases' } }
        filter {
            includeModule 'net.neoforged', 'testframework'
        }
    }
    mavenCentral()
}
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
}

neoForge {
    version = rootProject.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mchjong'
        }
    }
    mods { mchjong { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.mchjong
    }
}

def maidDependency = "touhoulittlemaid.snapshot:${touhou_little_maid_version}:${touhou_little_maid_snapshot}@jar"
configurations { maidSnapshot }
dependencies {
    compileOnly maidDependency
    maidSnapshot maidDependency
    if (providers.gradleProperty('withMaid').getOrElse('false').toBoolean()) runtimeOnly maidDependency
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.architectury:architectury-neoforge:${rei_architectury_version}"
    compileOnly "me.shedaniel.cloth:basic-math:${rei_basic_math_version}"
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'jei') {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        runtimeOnly "net.mezzdev.config:mezz_config-${minecraft_version}-neoforge:${mezz_config_version}"
    }
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    jarJar project(path: ':engine', configuration: 'embeddedEngine')
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${rootProject.neo_version}"
}

def testTemp = layout.buildDirectory.dir('tmp/test')
test {
    useJUnitPlatform()
    maxHeapSize = '2G'
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
}

processResources {
    dependsOn ':art:generateAssets', ':art:generateData'
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neo_loader_min_version: rootProject.neo_loader_min_version,
        jei_version: rootProject.jei_version,
        rei_version: rootProject.rei_version,
        touhou_little_maid_version: rootProject.touhou_little_maid_version
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
jar { from(rootProject.file('LICENSE')) }

// The same visual assertions run in both clients; only the lifecycle adapter differs.
sourceSets {
    smoke {
        java.srcDir '../common/src/smoke/java'
        resources.srcDir '../common/src/smoke/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def itemsSmoke = providers.gradleProperty('smokeItems').getOrElse('false').toBoolean()
def maidSmoke = providers.gradleProperty('withMaid').getOrElse('false').toBoolean()
def paletteSmoke = providers.gradleProperty('smokePalette').getOrElse('false').toBoolean()
def seatingSmoke = providers.gradleProperty('smokeSeating').getOrElse('false').toBoolean()
def interfaceSmoke = providers.gradleProperty('smokeInterface').getOrElse('false').toBoolean()
def visibilitySmoke = providers.gradleProperty('smokeVisibility').getOrElse('false').toBoolean()
def roomSmoke = providers.gradleProperty('smokeRoom').getOrElse('false').toBoolean()
def manualSmoke = providers.gradleProperty('smokeManual').getOrElse('false').toBoolean()
def browserSmoke = providers.gradleProperty('smokeBrowser').getOrElse('false').toBoolean()
def recipeBrowser = providers.gradleProperty('recipeBrowser').getOrElse('none')
if (!(recipeBrowser in ['none', 'jei'])) throw new GradleException('recipeBrowser must be none or jei')
def smokeProfile = maidSmoke ? 'maid-' : paletteSmoke ? 'palette-' : manualSmoke ? 'manual-' : browserSmoke ? 'browser-' : roomSmoke ? 'room-' : visibilitySmoke ? 'visibility-' : interfaceSmoke ? 'interface-' : seatingSmoke ? 'seating-' : itemsSmoke ? 'items-' : recipeBrowser != 'none' ? recipeBrowser + '-' : ''
def smokeEvidence = layout.buildDirectory.dir("smoke/${smokeProfile}evidence")
def smokeRun = layout.buildDirectory.dir("smoke/${smokeProfile}run")
neoForge {
    mods { mchjong_smoke { sourceSet sourceSets.smoke } }
    unitTest { loadedMods = [mods.mchjong] }
    runs {
        configureEach { loadedMods = [mods.mchjong] }
        smokeServer {
            server()
            gameDirectory = layout.buildDirectory.dir("smoke/${smokeProfile}server").get().asFile
            systemProperty 'java.io.tmpdir', layout.buildDirectory.dir("smoke/${smokeProfile}server").get().asFile.absolutePath
            programArguments = ['--nogui', '--initSettings']
        }
        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            loadedMods = [mods.mchjong, mods.mchjong_smoke]
            gameDirectory = smokeRun.get().asFile
            programArguments = ['--width', '1280', '--height', '800']
            systemProperty 'mchjong.smoke', 'true'
            systemProperty 'mchjong.smoke.maid', maidSmoke.toString()
            systemProperty 'mchjong.smoke.itemsOnly', itemsSmoke.toString()
            systemProperty 'mchjong.smoke.paletteOnly', paletteSmoke.toString()
            systemProperty 'mchjong.smoke.seatingOnly', seatingSmoke.toString()
            systemProperty 'mchjong.smoke.interfaceOnly', interfaceSmoke.toString()
            systemProperty 'mchjong.smoke.visibilityOnly', visibilitySmoke.toString()
            systemProperty 'mchjong.smoke.roomOnly', roomSmoke.toString()
            systemProperty 'mchjong.smoke.manualOnly', manualSmoke.toString()
            systemProperty 'mchjong.smoke.browserOnly', browserSmoke.toString()
            systemProperty 'mchjong.smoke.browser', recipeBrowser
            systemProperty 'mchjong.smoke.output', smokeEvidence.get().asFile.absolutePath
            systemProperty 'java.io.tmpdir', smokeRun.get().asFile.absolutePath
        }
    }
}
tasks.register('verifyMaidSnapshot') {
    inputs.files configurations.maidSnapshot
    inputs.property 'sha256', touhou_little_maid_sha256
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(configurations.maidSnapshot.singleFile.bytes).encodeHex().toString()
        if (digest != touhou_little_maid_sha256) throw new GradleException('The pinned Touhou Little Maid snapshot checksum does not match')
    }
}
tasks.named('compileJava') { dependsOn 'verifyMaidSnapshot' }

tasks.named('runSmokeClient') {
    doFirst { delete smokeEvidence.get().file('PASS.txt'), smokeEvidence.get().file('FAIL.txt') }
    doLast {
        def evidence = smokeEvidence.get().asFile
        if (!new File(evidence, 'PASS.txt').isFile() || new File(evidence, 'FAIL.txt').exists()) {
            throw new GradleException("NeoForge client smoke failed; see ${evidence} and ${smokeRun.get().asFile}/logs/latest.log")
        }
    }
}
