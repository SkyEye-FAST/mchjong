plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = "mchjong-neoforge-${minecraft_version}"
repositories {
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeModule 'net.fabricmc', 'fabric-loader' }
    }
    exclusiveContent {
        forRepository { maven { name = 'NeoForgedReleases'; url = 'https://maven.neoforged.net/releases' } }
        filter {
            includeModule 'net.neoforged', 'neoforge'
            includeModule 'net.neoforged', 'testframework'
        }
    }
    mavenCentral()
}
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.file('art/generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/create')
}

neoForge {
    version = rootProject.neo_version
    parchment {
        mappingsVersion = rootProject.parchment_version
        minecraftVersion = rootProject.minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mchjong'
        }
    }
    mods { mchjong { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.mchjong
    }
}

dependencies {
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE"
    if (providers.gradleProperty('withPatchouli').getOrElse('false').toBoolean()) {
        runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE"
    }
    // Optional recipe-browser APIs expose Fabric environment annotations.
    compileOnly "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly "com.electronwill.night-config:toml:${night_config_version}"
    compileOnly "maven.modrinth:create:${create_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    if (providers.gradleProperty('withCreate').getOrElse('false').toBoolean()) {
        runtimeOnly "maven.modrinth:create:${create_version}+mc${minecraft_version}"
        testImplementation "maven.modrinth:create:${create_version}+mc${minecraft_version}"
        testImplementation "com.tterrag.registrate:Registrate:${registrate_version}"
        testImplementation "net.createmod.ponder:ponder-neoforge:${create_ponder_min_version}+mc${minecraft_version}"
    }
    compileOnly "maven.modrinth:touhou-little-maid:${touhou_little_maid_version}"
    if (providers.gradleProperty('withMaid').getOrElse('false').toBoolean()) {
        runtimeOnly "maven.modrinth:touhou-little-maid:${touhou_little_maid_version}"
    }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'jei') {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        runtimeOnly "net.mezzdev.config:mezz_config-${minecraft_version}-neoforge:${mezz_config_version}"
    }
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'emi') {
        runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    }
    if (providers.gradleProperty('recipeBrowser').getOrElse('none') == 'rei') {
        runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    }
    if (providers.gradleProperty('withPonder').getOrElse('false').toBoolean()
        && !providers.gradleProperty('withCreate').getOrElse('false').toBoolean()) {
        runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    }
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    jarJar project(path: ':engine', configuration: 'embeddedEngine')
    additionalRuntimeClasspath project(path: ':engine', configuration: 'embeddedEngine')
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${rootProject.neo_version}"
}

def testTemp = layout.buildDirectory.dir('tmp/test')
test {
    useJUnitPlatform()
    maxHeapSize = '2G'
    systemProperty 'mchjong.create', providers.gradleProperty('withCreate').getOrElse('false')
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
}

if (!providers.gradleProperty('withCreate').getOrElse('false').toBoolean()) {
    sourceSets.test.java.exclude '**/CreateProcessingTest.java'
}

// Native Minecraft NBT APIs, isolated from the mod's main compilation and packaging.
sourceSets {
    ponderData {
        java.srcDir '../common/src/ponderData/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
}
sourceSets.ponderData.runtimeClasspath += sourceSets.ponderData.compileClasspath
tasks.register('generatePonder', JavaExec) {
    dependsOn tasks.named('ponderDataClasses')
    classpath = sourceSets.ponderData.runtimeClasspath
    mainClass = 'top.skyeyefast.mchjong.data.GeneratePonderStructure'
    def output = layout.buildDirectory.dir('generated/ponder')
    args output.get().asFile.absolutePath, 'create'
    inputs.files sourceSets.ponderData.allSource
    outputs.dir output
    doFirst { delete output }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version.toInteger()) }
}

processResources {
    with rootProject.tileFaceResources
    from tasks.named('generatePonder')
    dependsOn ':art:generateData', ':art:generateCreateData', 'generatePonder'
    mustRunAfter ':art:generateAssets'
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neo_loader_min_version: rootProject.neo_loader_min_version,
        ponder_version: rootProject.ponder_version,
        patchouli_version: rootProject.patchouli_version,
        create_version: rootProject.create_version,
        create_ponder_min_version: rootProject.create_ponder_min_version,
        jei_version: rootProject.jei_version,
        emi_version: rootProject.emi_version,
        rei_version: rootProject.rei_version,
        touhou_little_maid_version: rootProject.touhou_little_maid_version
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
jar { from(rootProject.file('LICENSE')) }

def recipeBrowser = providers.gradleProperty('recipeBrowser').getOrElse('none')
if (!(recipeBrowser in ['none', 'jei', 'emi', 'rei'])) throw new GradleException('recipeBrowser must be none, jei, emi or rei')
