plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version
base.archivesName = 'mchjong-neoforge'
repositories {
    exclusiveContent {
        forRepository { maven { name = 'NeoForgedReleases'; url = 'https://maven.neoforged.net/releases' } }
        filter {
            includeModule 'net.neoforged', 'neoforge'
            includeModule 'net.neoforged', 'testframework'
        }
    }
    mavenCentral()
}
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/assets')
    resources.srcDir rootProject.layout.buildDirectory.dir('generated/data')
}

neoForge {
    version = rootProject.neo_version
    parchment {
        mappingsVersion = rootProject.parchment_version
        minecraftVersion = rootProject.minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mchjong'
        }
    }
    mods { mchjong { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.mchjong
    }
}

dependencies {
    implementation project(path: ':engine', configuration: 'embeddedEngine')
    jarJar project(path: ':engine', configuration: 'embeddedEngine')
    additionalRuntimeClasspath project(path: ':engine', configuration: 'embeddedEngine')
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${rootProject.neo_version}"
}

def testTemp = layout.buildDirectory.dir('tmp/test')
test {
    useJUnitPlatform()
    maxHeapSize = '2G'
    doFirst { testTemp.get().asFile.mkdirs() }
    systemProperty 'java.io.tmpdir', testTemp.get().asFile.absolutePath
}

processResources {
    dependsOn ':art:generateAssets', ':art:generateData'
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neo_loader_min_version: rootProject.neo_loader_min_version
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
jar { from(rootProject.file('LICENSE')) }

// The same visual assertions run in both clients; only the lifecycle adapter differs.
sourceSets {
    smoke {
        java.srcDir '../src/smoke/java'
        java.exclude '**/FabricSmoke.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def smokeEvidence = layout.buildDirectory.dir('smoke/evidence')
neoForge {
    mods { mchjong_smoke { sourceSet sourceSets.smoke } }
    unitTest { loadedMods = [mods.mchjong] }
    runs {
        configureEach { loadedMods = [mods.mchjong] }
        smokeClient {
            client()
            sourceSet = sourceSets.smoke
            loadedMods = [mods.mchjong, mods.mchjong_smoke]
            gameDirectory = layout.buildDirectory.dir('smoke/run').get().asFile
            programArguments = ['--width', '1280', '--height', '800']
            systemProperty 'mchjong.smoke', 'true'
            systemProperty 'mchjong.smoke.output', smokeEvidence.get().asFile.absolutePath
            systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('smoke/run').get().asFile.absolutePath
        }
    }
}
tasks.named('runSmokeClient') {
    doLast {
        def evidence = smokeEvidence.get().asFile
        if (!new File(evidence, 'PASS.txt').isFile() || new File(evidence, 'FAIL.txt').exists()) {
            throw new GradleException('NeoForge client smoke failed; see neoforge/build/smoke/evidence and run/logs/latest.log')
        }
    }
}
